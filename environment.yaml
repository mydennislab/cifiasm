name: cifiasm
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - snakemake
  - snakemake-executor-plugin-slurm   # `snakemake --executor slurm`
  - samtools
  - minimap2
  - hifiasm
  - gfatools
  - yahs           # also provides the `juicer` binary (pre / post)
  - k8
  - openjdk        # for juicer_tools pre
  - pretextmap     # .pretext contact map from the scaffold pairs file
  - pretextsnapshot  # PNG of the map (contact_maps.snapshot)
  - python=3.12
  - pip
  - pip:
    - cifi >= 1.1.0
