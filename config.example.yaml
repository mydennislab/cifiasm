# cifiasm configuration
# Copy to config.yaml and edit the paths:  cp config.example.yaml config.yaml

# Everything the pipeline writes lands under this directory
# (cifi/, cifi2pe/, hifi/, asm/, mapping/, contacts/, yahs/, jbat/, contact_maps/,
# stats/, qc_cifi/).
output_dir: results

# Samples
# -------
# hifi:   one path or a list of PacBio HiFi read files (BAM / FASTQ / FASTA, .gz OK).
#         Every file is handed to hifiasm at full depth; BAM cells are converted
#         to FASTQ first. HiFi is never downsampled.
# cifi:   one path or a list of CiFi read files (BAM / FASTQ / FASTA, .gz OK).
#         All cells are merged into one unmapped BAM before QC and digestion.
# enzyme: restriction enzyme used for the CiFi library (HindIII, DpnII, NlaIII, ...).
#         `site` + `cut_pos` override `enzyme` for a custom recognition site.
# Legacy keys hifi_bam / hifi_fasta / cifi_bam are still accepted as aliases.
samples:
  my_sample:
    hifi: /path/to/hifi_reads.bam
    # hifi:
    #   - /path/to/hifi.cell1.fastq.gz
    #   - /path/to/hifi.cell2.bam
    cifi: /path/to/cifi_reads.bam
    enzyme: HindIII
    # site: "GANTC"     # IUPAC recognition sequence
    # cut_pos: 1        # 0-based cut position within the site
    #
    # Pre-downsampled CiFi inputs (external mode). Each key becomes a {label}
    # in the output paths ([A-Za-z0-9._-]+); each value is a BAM / FASTQ / FASTA
    # used as-is for that label. `cifi:` above is still required (cifi_qc runs on
    # it). Cannot be combined with dilution.enabled; with several samples every
    # sample must declare the same label set.
    # cifi_external:
    #   c10: /path/to/cifi.10pct.bam
    #   c25: /path/to/cifi.25pct.fa.gz
    #   c100: /path/to/cifi.bam

# CiFi toolkit (cifi >= 1.1.0) | refer to https://github.com/mydennislab/cifi-toolkit for details
cifi:
  qc:
    num_reads: 0            # reads sampled for QC (0 = all)
    min_sites: 0            # min enzyme sites for a read to count as usable
  digest:
    min_segments: 1         # -m: min segments per read
    min_segment_len: 20     # -l: min length of an emitted segment, bp (toolkit default is 60)
    strip_overhang: false    # false -> --no-strip-overhang
    revcomp_r2: false       # true -> --revcomp-r2 (independent of strip_overhang)
    gzip: false             # compress R1/R2
    fast: false             # streaming statistics
  # Legacy keys min_fragments / min_frag_len are accepted as aliases of
  # min_segments / min_segment_len (the new key wins if both are present).
  # If omitted, min_segments and min_segment_len fall back to 3 and 20 bp.

# Assembly
hifiasm:
  telomere_motif: "CCCTAAA" # 5'-end motif; null or "" omits --telo-m

# Segment mapping and contact calling
mapping:
  minimap2_preset: map-hifi # do not change without benchmarking
  contacts_mapq: 0          # cifi contacts -q: min MAPQ for a segment to take part in a contact;
                            # MAPQ 0 alignments never reach yahs

# Scaffolding uses contacts passing contacts_mapq; mapq: 0 applies no further
# filter. Contig error correction is disabled by default for CiFi scaffolding.
yahs:
  mapq: 0                   # yahs -q, applied on top of contacts_mapq
  contig_ec: false          # true: let yahs break contigs (Hi-C behaviour)

# CiFi dilution sweep (optional). Only CiFi is downsampled; each percentage
# becomes one {label}. Disabled: a single scenario labelled 100.
# This specific options was developed as a part of the voles paper to check
# how much cifi is needed for successful scaffolding.
dilution:
  enabled: false
  percentages: [20, 40, 60, 80, 100]

# Contact maps for manual curation. Each key adds files to `rule all`; the rules
# stay available as targets whatever is set here. Without this block: juicebox
# and pretext on, pairs and snapshot off.
# Snapshots also build the required Pretext map, even when pretext is false.
contact_maps:
  juicebox: true            # jbat_pre + jbat_hic: .assembly and .hic for Juicebox
  pretext: true             # scaffold_pairs + pretext_map: 4DN pairs in scaffold coordinates and the PretextMap map

  pairs: false              # keep the .scaffolds.pairs.gz in rule all when pretext is off
  snapshot: true           # pretext_snapshot: one PNG of the whole map (PretextSnapshot)

# External tools
# juicer_tools_jar must be a JuicerTools JAR that provides the `pre` command
# (juicer_tools_1.22.01.jar does; the aidenlab/JuicerTools 3.0.0 release does not):
#   wget https://s3.amazonaws.com/hicfiles.tc4ga.com/public/juicer/juicer_tools_1.22.01.jar
# The juicer_tools_jar key is required even when contact_maps.juicebox is false.
tools:
  juicer_tools_jar: "./juicer_tools_1.22.01.jar"

# SLURM (optional; defaults shown)
slurm:
  partition: "low"
  account: "publicgrp"
